frr version 10.0
frr defaults datacenter
hostname spine1
log syslog
service integrated-vtysh-config
!
ip forwarding
!
ip route 10.0.0.0/8 eth1
!
interface lo
 ip address 8.8.8.8/32
!
interface eth1
 ip address 80.4.0.0/31
!
router bgp 65201
 no bgp default ipv4-unicast
 neighbor 80.4.0.1 remote-as 65100
 !
 address-family ipv4 unicast
  network 10.0.0.11/32
  neighbor 80.4.0.1 activate
  neighbor 80.4.0.1 default-originate
 exit-address-family
!
end