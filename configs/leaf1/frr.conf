frr version 10.0
frr defaults datacenter
hostname leaf1
log syslog
service integrated-vtysh-config
!
ip forwarding
!
vrf CUST-BD
 vni 50020
exit-vrf
!
vrf CUST-WEB
 vni 50010
exit-vrf
!
interface eth1
 ip address 10.1.1.1/31
exit
!
interface eth2
 ip address 10.2.1.1/31
exit
!
interface lo
 ip address 10.0.0.21/32
exit
!
interface bond20
 evpn mh es-id 1
 evpn mh es-sys-mac 44:00:00:05:00:20 
!
evpn mh startup-delay 30
!
router bgp 65100
 bgp router-id 10.0.0.21
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.0.0.22 remote-as 65100
 neighbor 10.0.0.22 update-source 10.0.0.21
 neighbor 10.0.0.23 remote-as 65100
 neighbor 10.0.0.23 update-source 10.0.0.21
 neighbor 10.1.1.0 remote-as 65001
 neighbor 10.2.1.0 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.0.0.21/32
  neighbor 10.1.1.0 activate
  neighbor 10.1.1.0 allowas-in
  neighbor 10.2.1.0 activate
  neighbor 10.2.1.0 allowas-in
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.0.22 activate
  neighbor 10.0.0.23 activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
router bgp 65100 vrf CUST-WEB
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
router bgp 65100 vrf CUST-BD
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
end