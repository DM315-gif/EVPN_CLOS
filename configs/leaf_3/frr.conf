frr version 10.0
frr defaults datacenter
hostname leaf3
log syslog
service integrated-vtysh-config
!
ip forwarding
!
vrf CUST-BD
 vni 50020
exit-vrf
!
vrf CUST-WEB
 vni 50010
exit-vrf
!
interface eth1
 ip address 10.1.3.1/31
exit
!
interface eth2
 ip address 10.2.3.1/31
exit
!
interface eth5
 ip address 80.4.0.1/31
!
interface lo
 ip address 10.0.0.23/32
exit
!
router bgp 65100
 bgp router-id 10.0.0.23
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.0.0.21 remote-as 65100
 neighbor 10.0.0.21 update-source 10.0.0.23
 neighbor 10.0.0.22 remote-as 65100
 neighbor 10.0.0.22 update-source 10.0.0.23
 neighbor 10.1.3.0 remote-as 65001
 neighbor 10.2.3.0 remote-as 65002
 neighbor 80.4.0.0 remote-as 65201
 !
 address-family ipv4 unicast
  network 10.0.0.23/32
  neighbor 10.1.3.0 activate
  neighbor 10.1.3.0 allowas-in
  neighbor 10.2.3.0 activate
  neighbor 10.2.3.0 allowas-in
  neighbor 80.4.0.0 activate
  neighbor 80.4.0.0 allowas-in
  maximum-paths 2
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.0.21 activate
  neighbor 10.0.0.22 activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
router bgp 65100 vrf CUST-WEB
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  default-originate ipv4
  advertise ipv4 unicast
 exit-address-family
exit
!
router bgp 65100 vrf CUST-BD
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  default-originate ipv4
  advertise ipv4 unicast
 exit-address-family
exit
!
end